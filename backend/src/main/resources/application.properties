spring.application.name=NextRound
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nextround}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration-time=${JWT_EXPIRATION}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never



